# Release: pushing a tag v1, v2, ... (made on main) applies infra/ (no-op when nothing changed),
# builds the static site and uploads it. Pushing to main alone deploys nothing.
#   git tag v1 && git push origin v1
# To redeploy an existing tag: Actions → Deploy → Run workflow → "Use workflow from" → pick the tag.
name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write # OIDC sign-in to AWS
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt a terraform apply halfway

env:
  AWS_REGION: eu-central-1
  AWS_ROLE: arn:aws:iam::030171611942:role/github-deploy

jobs:
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    outputs:
      bucket: ${{ steps.out.outputs.bucket }}
      distribution: ${{ steps.out.outputs.distribution }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, to check the tag is on main
      - name: Only release tags that are on main
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo "::error::Deploy runs from a v* tag, not $GITHUB_REF"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve
      - id: out
        run: |
          echo "bucket=$(terraform output -raw bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw distribution_id)" >> "$GITHUB_OUTPUT"

  site:
    needs: infra
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ needs.infra.outputs.bucket }}
      DISTRIBUTION: ${{ needs.infra.outputs.distribution }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload to S3
        run: |
          # Content-hashed build files never change: browsers keep them for a year. Old ones are
          # left in place so a page that's already open can still load its chunks.
          aws s3 sync out/_next/static "s3://$BUCKET/_next/static" \
            --cache-control "public, max-age=31536000, immutable"
          # Everything else (HTML, RSC .txt payloads, music, images): browsers revalidate on each
          # visit (cheap 304s), CloudFront keeps a copy until the invalidation below.
          aws s3 sync out "s3://$BUCKET" --delete --exclude "_next/static/*" \
            --cache-control "public, max-age=0, s-maxage=31536000, must-revalidate"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*" --query Invalidation.Id --output text
