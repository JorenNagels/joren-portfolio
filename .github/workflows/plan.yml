# Pull requests that touch infra/: show what `terraform apply` would change once merged.
name: Terraform plan

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/**']

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::030171611942:role/github-plan
          aws-region: eu-central-1
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      # Read-only role, so no state lock (taking one means writing a lock file to S3).
      - run: |
          terraform plan -input=false -lock=false -no-color | tee plan.txt
          { echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
